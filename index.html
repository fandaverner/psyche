<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psyché – komplexní test osobnosti</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e8;--card:#fffdf9;--ink:#1f2430;--muted:#6b6f7a;--line:#e5dccd;--acc:#2f5d62;--acc-l:#e3eded;--acc2:#b8603e;--acc2-l:#f8ebe4;--ok:#4f7a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px 90px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:26px;font-weight:600}
h3{font-size:19px;font-weight:600;margin-top:1.2em}
p{margin:.5em 0 .9em}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}
.hero{text-align:center;padding:40px 24px}
.hero .sym{font-family:Fraunces,serif;font-size:64px;color:var(--acc);line-height:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--acc);color:#fff;font:600 16px Inter,sans-serif;padding:13px 26px;border-radius:12px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sm{padding:8px 16px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:14.5px}
input,select{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font:500 14.5px Inter,sans-serif;color:var(--ink)}
.pill.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.prog .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .t{font-weight:500;font-size:16.5px}
.q.done .t{color:var(--muted)}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lik.four{grid-template-columns:repeat(4,1fr)}
.lik button{padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font:500 12.5px/1.25 Inter,sans-serif;cursor:pointer;color:var(--ink);min-height:48px}
.lik button:hover{border-color:var(--acc)}
.lik button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.opts.txt{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer;text-align:center;font:500 14px/1.35 Inter,sans-serif;color:var(--ink)}
.opts.txt .opt{text-align:left;padding:12px 14px}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-l);box-shadow:0 0 0 2px var(--acc) inset}
.opt svg{width:100%;height:120px;display:block;margin-bottom:6px}
.sw{height:64px;border-radius:9px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08)}
.sec-intro{background:var(--acc-l);border-radius:14px;padding:14px 18px;margin:8px 0 4px;font-size:15px}
.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
/* results */
.trait{margin:22px 0;padding-top:16px;border-top:1px solid var(--line)}
.trait:first-of-type{border-top:0}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.th h3{margin:0}
.meter{height:12px;background:#ece5d9;border-radius:8px;position:relative;margin:10px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--acc)}
.meter b{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--acc-l);color:var(--acc);font-size:13px;font-weight:600}
.tag.w{background:var(--acc2-l);color:var(--acc2)}
.flag{border-left:4px solid var(--acc2);padding:12px 16px;background:var(--acc2-l);border-radius:8px;margin:10px 0}
.flag.ok{border-color:var(--ok);background:#edf3ea}
.arche{text-align:center;padding:32px 24px;background:linear-gradient(160deg,#2f5d62,#1f3f44);color:#fff;border:0}
.arche h1{color:#fff;margin:.1em 0 .2em}
.arche .k{opacity:.8;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.arche p{opacity:.92;max-width:560px;margin:10px auto 0}
ul.cl{padding-left:20px;margin:.4em 0}
ul.cl li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.box{background:#faf6ef;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chart{display:flex;justify-content:center}
.chart svg{max-width:100%;height:auto}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:#fff}
.quote{font-style:italic;color:#444}
.disc{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<script>

['O',1,'Mám bohatou slovní zásobu.'],['O',-1,'Abstraktní myšlenky mě nebaví.'],['O',1,'Mám živou představivost.','pO'],['O',-1,'Mám slabou představivost.','pO'],['O',1,'Mám skvělé nápady.'],['O',-1,'Umění mě nechává chladn[ým|ou].'],['O',1,'Rychle chápu nové věci.'],['O',1,'Rád[|a] přemýšlím o hlubokých otázkách.'],['O',-1,'Nevyhledávám nové zážitky a změny.'],['O',1,'Jsem pln[ý|á] nápadů.'],
// HEXACO Poctivost-pokora
['H',1,'Nikdy bych nepřijal[|a] úplatek, ani kdyby byl hodně velký.'],['H',1,'Nepředstírám, že mám někoho rád[|a], jen abych z něj něco získal[|a].'],['H',1,'Abych se cítil[|a] dobře, nepotřebuji luxusní věci.'],['H',1,'Nepovažuji se za nikoho výjimečnějšího než ostatní.'],['H',-1,'Lichotím lidem, abych dosáhl[|a] svého.'],['H',-1,'Kdybych věděl[|a], že mě nikdo nemůže chytit, klidně bych vzal[|a] cizí peníze.'],['H',-1,'Chci, aby lidé věděli, že jsem důležitá osoba.'],['H',-1,'Rád[|a] bych žil[|a] ve velkém luxusu.'],
// Temná triáda
['M',1,'Umím lidi zmanipulovat, abych dosáhl[|a] svého.'],['M',1,'Je chytré schovávat si informace, které můžu později použít proti druhým.'],['M',1,'Vyplatí se lidem říkat to, co chtějí slyšet, i když to není pravda.'],['M',1,'Svět je o tom, kdo koho přechytračí.'],
['P',1,'Málokdy cítím lítost, když někomu ublížím.'],['P',1,'Riskuji jen pro to vzrušení, i když to může špatně dopadnout.'],['P',1,'Pomsta má být rychlá a tvrdá.'],['P',1,'Moc mě netrápí, když je někdo kvůli mně smutný.'],
['X',1,'Chci, aby mě lidé obdivovali.'],['X',1,'Zasloužím si zvláštní zacházení.'],['X',1,'Očekávám od druhých uznání a pozornost.'],['X',1,'Jsem schopnější než většina lidí kolem mě.'],
// Lži-skóre (validita)
['L',1,'Nikdy v životě jsem nikomu nezalhal[|a], ani v maličkosti.'],['L',1,'Nikdy jsem o nikom neřekl[|a] nic nepěkného za jeho zády.'],['L',1,'Vždycky dodržím úplně každý slib.']
];
const REL = [
['AX',1,'Bojím se, že mě blízcí lidé (partner/ka) opustí.'],['AX',1,'Potřebuji časté ujištění, že mě druzí mají rádi.'],['AX',1,'Když mi blízký člověk dlouho neodpovídá, znejistím.'],['AX',1,'Bojím se, že mě druzí nemají tak rádi jako já je.'],['AX',-1,'Málokdy se bojím, že bych zůstal[|a] opuštěn[ý|á].'],
['AV',1,'Je mi nepříjemné, když se ke mně někdo citově moc přiblíží.'],['AV',1,'Nerad[|a] ukazuji druhým, co doopravdy cítím.'],['AV',1,'Těžko si dovolím na někom záviset.'],['AV',1,'Když se vztah stane hodně blízkým, mám tendenci se stáhnout.'],['AV',-1,'Snadno se blízkým lidem otevřu.'],

];

['D','Malý zájem o věci nebo malé potěšení z činností'],['D','Pocity skleslosti, smutku nebo beznaděje'],
['G','Pocit nervozity, úzkosti nebo napětí'],['G','Neschopnost zastavit nebo ovládat své obavy']
];

/* Tree SVGs (Baumtest) */
const GR='#5f8f4e',GR2='#46743d',BR='#7a5233';
const ground='<line x1="5" y1="134" x2="115" y2="134" stroke="#cbbfa9" stroke-width="2"/>';
const TREES = {
 dub:`<svg viewBox="0 0 120 140">${ground}<path d="M52 134 C51 112 53 96 55 80 L65 80 C67 96 69 112 68 134Z" fill="${BR}"/><path d="M53 128 Q40 133 26 138 M67 128 Q80 133 94 138 M60 131 Q56 136 50 139" stroke="${BR}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="38" cy="56" r="25" fill="${GR}"/><circle cx="82" cy="56" r="25" fill="${GR}"/><circle cx="60" cy="38" r="29" fill="${GR2}"/><circle cx="60" cy="66" r="24" fill="${GR}"/><circle cx="26" cy="72" r="14" fill="${GR2}"/><circle cx="94" cy="72" r="14" fill="${GR2}"/></svg>`,

 holy:`<svg viewBox="0 0 120 140">${ground}<path d="M55 134 L57 70 L63 70 L65 134Z" fill="${BR}"/><g stroke="${BR}" stroke-width="3" fill="none" stroke-linecap="round"><path d="M60 72 L60 18"/><path d="M60 80 L32 50 L22 30"/><path d="M60 78 L90 46 L98 26"/><path d="M60 50 L42 30"/><path d="M60 46 L80 26"/><path d="M32 50 L18 52"/><path d="M90 46 L104 48"/><path d="M42 30 L38 16"/><path d="M80 26 L86 12"/></g></svg>`,

const PROJ = [
 {id:'tree',page:'baum',t:'Představ si, že máš nakreslit strom – jakýkoli, ne nutně hezký. Který z těchto se nejvíc blíží stromu, který by se ti vybavil jako první?',opts:[['dub','Mohutný listnatý strom (dub)'],['topol','Vysoký štíhlý strom (topol)'],['holy','Strom bez listí'],['smrk','Jehličnan (smrk)'],['jablon','Ovocný strom s plody'],['vrba','Smuteční vrba'],['stromek','Malý stromek']],svg:true},

/* ===================== PAGES ===================== */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const mainItems=MAIN.map((x,i)=>({id:'m'+i,s:x[0],k:x[1],t:x[2],p:x[3]||null,type:'lik'}));
for(let i=mainItems.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[mainItems[i],mainItems[j]]=[mainItems[j],mainItems[i]];}
const relItems=REL.map((x,i)=>({id:'r'+i,s:x[0],k:x[1],t:x[2],type:'lik'}));
for(let i=relItems.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[relItems[i],relItems[j]]=[relItems[j],relItems[i]];}
const phqItems=PHQ4.map((x,i)=>({id:'d'+i,s:x[0],t:x[1],type:'phq'}));

/* ===================== SCORING ===================== */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const NORM={E:[3.2,.85],A:[3.85,.65],C:[3.55,.7],N:[2.85,.8],O:[3.75,.6],H:[3.3,.65],M:[2.5,.75],X:[2.7,.75],P:[1.9,.65]};
function normFor(s){
 let [m,sd]=NORM[s];const g=S.profile.gender,a=S.profile.age;
 const adj={f:{N:.25,A:.15,H:.15,P:-.2,M:-.15,X:-.1},m:{N:-.1,A:-.1,H:-.1,P:.15,M:.05}};
 if(adj[g]&&adj[g][s])m+=adj[g][s];
 const ag=a<25?{C:-.15,N:.1,A:-.05,H:-.1,P:.1,X:.1}:a<40?{}:a<60?{C:.1,A:.1,N:-.1,H:.1}:{C:.15,A:.15,N:-.15,O:-.1,H:.2,X:-.1};
 if(ag[s])m+=ag[s];return [m,sd];
}
function mean(s,items){const it=items.filter(x=>x.s===s);return it.reduce((a,x)=>a+(x.k===1?S.answers[x.id]:6-S.answers[x.id]),0)/it.length}
function pct(s){const m=mean(s,mainItems);const [nm,sd]=normFor(s);return Math.round(Math.min(99,Math.max(1,Phi((m-nm)/sd)*100)))}
const lvl=p=>p<15?0:p<35?1:p<65?2:p<85?3:4;

 const lv=ALL.filter(x=>x.type==='lik').map(x=>a[x.id]);const cnt=[0,0,0,0,0,0];lv.forEach(v=>cnt[v]++);r.mode=Math.max(...cnt)/lv.length;
 let inc=0;['pE','pA','pC','pN','pO'].forEach(t=>{const p=mainItems.filter(x=>x.p===t);const v=p.map(x=>x.k===1?a[x.id]:6-a[x.id]);if(Math.abs(v[0]-v[1])>=3)inc++});r.inc=inc;

 const ks=['E','A','C','O','H','N'],lab=['Extraverze','Přívětivost','Svědomitost','Otevřenost','Poctivost','Neuroticismus'];
 const cx=170,cy=150,R=105;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/ks.length;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};

 const poly=ks.map((k,i)=>pt(i,r[k]).join(',')).join(' ');

 <h3>Jak zvládáš stres</h3><p>${T(stressTxt)}</p></div>
 <div class="card" id="s-risk"><h2>Rizikové vzorce a odchylky</h2><p class="muted">Kombinace rysů, které podle výzkumu zvyšují riziko psychických obtíží nebo problémů ve vztazích. Nejde o diagnózy – jen o oblasti, kterým stojí za to věnovat pozornost.</p>
 ${flags.length?flags.map(f=>`<div class="flag"><b>${T(f[0])}</b><br>${T(f[1])}</div>`).join(''):'<div class="flag ok"><b>Žádné výrazné rizikové vzorce.</b><br>Tvé skóre se drží v pásmu, které nenaznačuje zvýšené riziko psychických obtíží ani problematických osobnostních rysů.</div>'}</div>
 <div class="card" id="s-work"><h2>Práce a kariéra</h2><p>${T(workTxt.filter(Boolean).join(' '))}</p><h3>Nejbližší profesní typy (Hollandův model RIASEC)</h3>
 ${top.map((t,i)=>`<div class="box" style="margin:8px 0"><b>${i+1}. ${RIASEC[t][0]}</b><div class="small muted">${RIASEC[t][1]}</div></div>`).join('')}
 ${fl?`<p class="small">${fit?'Tvůj současný obor tomuto profilu <b>dobře odpovídá</b>.':'Tvůj současný obor se s nejvýraznějšími typy úplně nepotkává. Nemusí to být problém, ale pokud tě práce vyčerpává, může to být jeden z důvodů.'}</p>`:''}
 <p class="small muted">Odhad typů je odvozen z osobnostních rysů, ne z dotazníku zájmů, takže ber jako inspiraci.</p></div>
 <div class="card" id="s-proj"><h2>Projektivní testy</h2><p class="muted">Projektivní metody pracují se symboly a představami. Jejich interpretace je tradiční a <b>vědecká spolehlivost je nízká</b>. Ber je jako podnět k zamyšlení, ne jako měření.</p>
 <h3>Baumův test stromu</h3><div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:16px"><div style="width:110px;flex:none">${TREES[a.tree]}</div><div><p>${T(TREE_I[a.tree])}</p></div></div>
 <ul class="cl"><li>${T(ROOT_I[a.roots])}</li><li>${T(TRUNK_I[a.trunk])}</li><li>${T(POS_I[a.pos])}</li><li>${T(WEATHER_I[a.weather])}</li></ul>
 <h3>Lüscherův barevný test</h3><div class="row"><div style="width:44px;height:44px;border-radius:8px;background:${COLORS.find(c=>c[0]===a.cfav)[2]}"></div><div style="flex:1;min-width:200px">${CF[a.cfav]}</div></div>
 <div class="row" style="margin-top:10px"><div style="width:44px;height:44px;border-radius:8px;background:${COLORS.find(c=>c[0]===a.crej)[2]}"></div><div style="flex:1;min-width:200px">${T(CR[a.crej])}</div></div>
 ${a.cfav===a.crej?'<p class="small muted">Jako oblíbenou i neoblíbenou jsi zvolil[|a] stejnou barvu, což ukazuje na ambivalentní vztah k tomu, co barva symbolizuje.</p>':''}
 <h3>Kostka v poušti</h3><ul class="cl"><li>${T(CUBE[a.cube])}</li><li>${T(CUBE[a.mat])}</li><li>${T(CUBE[a.horse])}</li><li>${T(CUBE[a.storm==='far'?'sfar':a.storm==='none'?'snone':a.storm])}</li></ul></div>
 <div class="card" id="s-val"><h2>Validita odpovědí</h2>${valOk?'<div class="flag ok">Odpovědi působí konzistentně a upřímně, takže profil by měl být spolehlivý.</div>':val.map(v=>`<div class="flag">${T(v)}</div>`).join('')}
 <p class="small muted">Kontrolní mechanismy: škála sociální žádoucnosti (podle principu L-škály MMPI), ${r.inc} z 5 rozporných párů, ${Math.round(r.mode*100)} % stejných odpovědí, ${r.secs<900?Math.round(r.secs/60)+' min':'—'} celkový čas.</p>
 <div class="disc">Test slouží k sebepoznání a zábavě. Položky jsou adaptacemi volně dostupných vědeckých dotazníků (IPIP, HEXACO, ECR, RSES, PHQ-4) a normy jsou orientační odhady z publikovaných studií, ne česká standardizace. Výsledek nenahrazuje vyšetření psychologem ani psychiatrem a nemůže stanovit žádnou diagnózu. Pokud tě něco z výsledků znepokojuje, obrať se na odborníka. Linka první psychické pomoci: 116 123.</div>
 <div class="row" style="margin-top:18px"><button class="btn" id="copy">Zkopírovat výsledky jako text</button><button class="btn ghost" id="redo">Vyplnit znovu</button><button class="btn ghost" id="edit">Upravit odpovědi</button></div></div>`;
 app.innerHTML=h;
 $('#redo').onclick=()=>{S={screen:'intro',profile:{},answers:{},page:0,start:null};try{localStorage.removeItem(LS)}catch(e){}saved=null;render();scrollTo(0,0)};
 $('#edit').onclick=()=>{S.screen='q';S.page=0;save();render();scrollTo(0,0)};
 $('#copy').onclick=()=>{
  const lines=[`PSYCHÉ – osobnostní profil${nm?' – '+nm:''}`,`Typ: ${ar[0]}${nmod?' ('+nmod+')':''} · temperament: ${tp[0]}`,G(summary),'',...[...order,'H'].map(k=>`${TR[k].n}: ${r[k]}. percentil (${LVL[lvl(r[k])]})`),'',`Citová vazba: ${att[0]}`,`Sebehodnocení: ${rse[0]}`,`Machiavelismus ${r.M}. / Narcismus ${r.X}. / Psychopatie ${r.P}. percentil`,`PHQ-4: ${r.PHQ}/12 (${phq[0]})`,`Profesní typy: ${top.map(t=>RIASEC[t][0]).join(', ')}`,'',`Rizikové vzorce: ${flags.length?flags.map(f=>G(f[0])).join('; '):'žádné výrazné'}`];
  const txt=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Zkopírováno do schránky')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Zkopírováno')}catch(e){toast('Kopírování se nezdařilo')}ta.remove()});
 };
}
render();
</script>
</body>
</html>
