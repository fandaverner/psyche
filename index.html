<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psyché – komplexní test osobnosti</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e8;--card:#fffdf9;--ink:#1f2430;--muted:#6b6f7a;--line:#e5dccd;--acc:#2f5d62;--acc-l:#e3eded;--acc2:#b8603e;--acc2-l:#f8ebe4;--ok:#4f7a4a;--ok-l:#edf3ea;--mid:#b88a2e;--mid-l:#f8f0dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 90px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(30px,6vw,46px);font-weight:700}
h2{font-size:26px;font-weight:600}
h3{font-size:19px;font-weight:600;margin-top:1.2em}
p{margin:.5em 0 .9em}
.muted{color:var(--muted)}.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}
@media(max-width:560px){.card{padding:18px 14px}}
.hero{text-align:center;padding:40px 24px}
.hero .sym{font-family:Fraunces,serif;font-size:64px;color:var(--acc);line-height:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--acc);color:#fff;font:600 16px Inter,sans-serif;padding:13px 26px;border-radius:12px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:14.5px}
input,select{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font:500 14.5px Inter,sans-serif;color:var(--ink)}
.pill.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.pill:disabled{opacity:.5}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.prog .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .t{font-weight:500;font-size:16.5px}
.q.done .t{color:var(--muted)}
.q .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sc{display:grid;gap:6px;margin-top:10px}
.sc button{padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:10px;font:500 12.5px/1.25 Inter,sans-serif;cursor:pointer;color:var(--ink);min-height:48px}
.sc button:hover{border-color:var(--acc)}
.sc button{overflow-wrap:anywhere;hyphens:auto}
@media(max-width:480px){.sc{gap:4px}.sc button{font-size:11.5px;padding:8px 2px}}
.sc button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.opts.pair{grid-template-columns:1fr 1fr}
@media(max-width:520px){.opts.pair{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:500 14.5px/1.4 Inter,sans-serif;color:var(--ink)}
.opts.pair .opt{text-align:center;padding:16px 12px}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-l);box-shadow:0 0 0 2px var(--acc) inset}
.opts.colors{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.opts.colors .opt{text-align:center;padding:8px}
.sw{height:60px;border-radius:9px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08)}
.sec-intro{background:var(--acc-l);border-radius:14px;padding:14px 18px;margin:8px 0 4px;font-size:15px}
.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
/* tasks */
.stage{height:200px;border-radius:16px;background:#f1ebe0;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:14px 0;transition:background .12s;cursor:pointer}
.stage span{font:700 72px Inter,sans-serif;color:var(--ink)}
.stage.dark{background:#262b35}
.sbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtns button{padding:14px 4px;font-size:15px;border-radius:10px}
.tdone{background:var(--ok-l);border-radius:12px;padding:12px 16px;color:var(--ok);font-weight:600}
/* results */
.trait{margin:22px 0;padding-top:16px;border-top:1px solid var(--line)}
.trait:first-of-type{border-top:0}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.th h3{margin:0}
.meter{height:12px;background:#ece5d9;border-radius:8px;position:relative;margin:10px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--acc)}
.meter b{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--acc-l);color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}
.tag.w{background:var(--acc2-l);color:var(--acc2)}.tag.m{background:var(--mid-l);color:var(--mid)}.tag.ok{background:var(--ok-l);color:var(--ok)}
.flag{border-left:4px solid var(--acc2);padding:12px 16px;background:var(--acc2-l);border-radius:8px;margin:10px 0}
.flag.ok{border-color:var(--ok);background:var(--ok-l)}.flag.m{border-color:var(--mid);background:var(--mid-l)}
.arche{text-align:center;padding:32px 24px;background:linear-gradient(160deg,#2f5d62,#1f3f44);color:#fff;border:0}
.arche h1{color:#fff;margin:.1em 0 .2em}
.arche .k{opacity:.8;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.arche p{opacity:.92;max-width:560px;margin:10px auto 0}
ul.cl{padding-left:20px;margin:.4em 0}ul.cl li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.box{background:#faf6ef;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chart{display:flex;justify-content:center}.chart svg{max-width:100%;height:auto}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:#fff}
.quote{font-style:italic;color:#444}
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td,table.st th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.st th{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi div{background:#faf6ef;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:600 22px Fraunces,serif}
.kpi span{font-size:12.5px;color:var(--muted)}
.disc{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.mods{columns:2;column-gap:24px;font-size:14.5px}@media(max-width:560px){.mods{columns:1}}
.mods li{break-inside:avoid;margin:3px 0}
</style>
</head>

const SCEN=[
['Kamarád ti celý den neodpověděl na zprávu. Co tě napadne jako první?',['Má asi hodně práce, ozve se.','Doufám, že se mu nic nestalo.','Ignoruje mě, to je od něj drzost.','Asi jsem napsal[|a] něco špatně.']],

function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const NORM={E:[3.2,.85],A:[3.85,.65],C:[3.55,.7],N:[2.85,.8],O:[3.75,.6],H:[3.3,.65],M:[2.5,.75],X:[2.7,.75],P:[1.9,.65]};
function normFor(s){
 let [m,sd]=NORM[s];const g=S.profile.gender,a=S.profile.age;
 const adj={f:{N:.25,A:.15,H:.15,P:-.2,M:-.15,X:-.1},m:{N:-.1,A:-.1,H:-.1,P:.15,M:.05}};
 if(adj[g]&&adj[g][s])m+=adj[g][s];
 const ag=a<25?{C:-.15,N:.1,A:-.05,H:-.1,P:.1,X:.1}:a<40?{}:a<60?{C:.1,A:.1,N:-.1,H:.1}:{C:.15,A:.15,N:-.15,O:-.1,H:.2,X:-.1};
 if(ag[s])m+=ag[s];return [m,sd];

 h+=sec('s-risk','Rizikové vzorce a odchylky',flags.length?flags.map(f=>`<div class="flag"><b>${T(f[0])}</b><br>${T(f[1])}</div>`).join(''):fl3(0,'<b>Žádné výrazné rizikové vzorce.</b> Tvé osobnostní skóre nenaznačuje zvýšené riziko.'),'Kombinace osobnostních rysů a automatických reakcí, které podle výzkumu zvyšují riziko obtíží.');
 h+=sec('s-work','Práce a kariéra',`<p>${T(workTxt)}</p><h3>Nejbližší profesní typy (Holland – RIASEC)</h3>${top.map((t,i)=>`<div class="box" style="margin:8px 0"><b>${i+1}. ${RIASEC[t][0]}</b><div class="small muted">${RIASEC[t][1]}</div></div>`).join('')}${fl?`<p class="small">${fit?'Tvůj současný obor tomuto profilu <b>dobře odpovídá</b>.':'Tvůj obor se s nejvýraznějšími typy úplně nepotkává – pokud tě práce vyčerpává, může to být jeden z důvodů.'}</p>`:''}`);
 h+=sec('s-proj','Projektivní úlohy',`<h3 style="margin-top:0">Lüscherův barevný test</h3><div class="row"><div style="width:44px;height:44px;border-radius:8px;flex:none;background:${COLORS.find(c=>c[0]===a.cfav)[2]}"></div><div style="flex:1;min-width:200px">${CF[a.cfav]}</div></div><div class="row" style="margin-top:10px"><div style="width:44px;height:44px;border-radius:8px;flex:none;background:${COLORS.find(c=>c[0]===a.crej)[2]}"></div><div style="flex:1;min-width:200px">${T(CR[a.crej])}</div></div>
 <h3>Kostka v poušti</h3><ul class="cl"><li>${T(CUBE[a.cube])}</li><li>${T(CUBE[a.mat])}</li><li>${T(CUBE[a.horse])}</li><li>${T(CUBE[a.storm==='far'?'sfar':a.storm==='none'?'snone':a.storm])}</li></ul>`,'Projektivní metody mají nízkou vědeckou spolehlivost – ber je jako podnět k zamyšlení.');
 h+=sec('s-val','Validita odpovědí',`${valOk?fl3(0,'Odpovědi působí konzistentně a upřímně, takže profil by měl být spolehlivý.'):val.map(v=>fl3(1,v)).join('')}
 <div class="kpi">${kpi(r.chk===0?'✓':r.chk+'× ✗','kontrolní otázky')}${kpi(r.L.toFixed(1)+'/5','škála lži')}${kpi(r.inc+'/5','rozporné páry')}${kpi(r.latFast?(r.latFast/1000).toFixed(1)+' s':'—','průměrně na otázku')}${kpi(r.secs?Math.round(r.secs/60)+' min':'—','celkový čas')}</div>
 <div class="disc">Test slouží k sebepoznání. Položky jsou české adaptace volně dostupných vědeckých nástrojů (IPIP, HEXACO, ECR, RSES, ASRS, AQ-10, PHQ-8, GAD-7, Mini-SPIN, MDQ, PC-PTSD-5, MSI-BPD, AUDIT-C, SCOFF) a normy jsou orientační, ne česká standardizace. Výsledek nenahrazuje vyšetření psychologem ani psychiatrem a nemůže stanovit diagnózu. Linka první psychické pomoci: 116 123.</div>
 <div class="row" style="margin-top:18px"><button class="btn" id="copy">Zkopírovat výsledky jako text</button><button class="btn ghost" id="edit">Upravit odpovědi</button><button class="btn ghost" id="redo">Vyplnit znovu</button></div>`);
 app.innerHTML=T(h);
 $('#redo').onclick=()=>{S={screen:'intro',profile:{},answers:{},lat:{},page:0,start:null};try{localStorage.removeItem(LS)}catch(e){}saved=null;render();scrollTo(0,0)};
 $('#edit').onclick=()=>{S.screen='q';S.page=0;save();render();scrollTo(0,0)};
 $('#copy').onclick=()=>{
  const lines=[`PSYCHÉ – osobnostní profil${nm?' – '+nm:''}`,`Typ: ${ar[0]}${nmod?' ('+nmod+')':''} · temperament: ${tp[0]}`,summary,'',...[...order,'H'].map(k=>`${TR[k].n}: ${r[k]}. percentil (${LVL[lvl(r[k])]})`),`Machiavelismus ${r.M}. / Narcismus ${r.X}. / Psychopatie ${r.P}. percentil`,`Citová vazba: ${att[0]} · sebehodnocení: ${rse[0]}`,'','SCREENING:',...cl.list.map(c=>`${c.n}: ${st(c.lv)[0]} (${c.sc})`),'',`ÚLOHY: impulzivní chyby ${Math.round(g.com*100)} %, vynechávky ${Math.round(g.om*100)} %, CV ${g.cv.toFixed(2)}, Stroop ${s.ic} ms, paměť ${sp.span}, balónky ${b.adj.toFixed(1)}, odměna hned ${r.dd}/7`,`Interpretace situací: neutrální ${r.ib.b}, úzkostná ${r.ib.a}, nepřátelská ${r.ib.h}, sebeobviňující ${r.ib.s}`,`Rizikové vzorce: ${flags.length?flags.map(f=>T(f[0])).join('; '):'žádné výrazné'}`];
  const txt=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Zkopírováno do schránky')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Zkopírováno')}catch(e){toast('Kopírování se nezdařilo')}ta.remove()});
 };
}
render();
